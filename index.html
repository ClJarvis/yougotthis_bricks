<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LEGO Minifig Collection Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header>
        <div>
          <h1>LEGO Minifig Collection Tracker</h1>
          <p>Search for minifigs and track which set they come from.</p>
        </div>
      </header>

      <!--section class="panel">
        <p class="status" id="keyStatus">API key is stored on the server, not in the browser.</p>
      </section -->

      <section class="panel">
        <div class="row">
          <input id="searchInput" type="search" placeholder="Search minifigs by name" />
          <button id="searchButton">Search</button>
        </div>
        <p class="status" id="searchStatus">Search for a minifig by name, then add it to your collection.</p>
      </section>

      <section class="grid" id="mainGrid">
        <div class="card" id="resultsCard">
          <h2>Search Results</h2>
          <div id="resultsContainer"></div>
        </div>

        <div class="card">
          <h2>Your Collection</h2>
          <ul class="collection-list" id="collectionList"></ul>
          <p class="status" id="collectionStatus">No minifigs tracked yet.</p>
        </div>
      </section>
    </div>

    <script src="scripts.js"></script>
  </body>
</html>
